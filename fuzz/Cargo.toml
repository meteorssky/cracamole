[package]
name = "cracamole-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
guac-protocol = { path = "../crates/guac-protocol" }
guac-terminal = { path = "../crates/guac-terminal" }
guac-display = { path = "../crates/guac-display" }
proto-telnet = { path = "../crates/proto-telnet" }

[[bin]]
name = "parse_instruction"
path = "fuzz_targets/parse_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "telnet_decoder"
path = "fuzz_targets/telnet_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vt_input"
path = "fuzz_targets/vt_input.rs"
test = false
doc = false
bench = false

[[bin]]
name = "color_scheme"
path = "fuzz_targets/color_scheme.rs"
test = false
doc = false
bench = false
