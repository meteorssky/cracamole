<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded app container background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Left Rust Crab Claw / Bracket -->
  <path d="M22 64 C12 60 10 40 28 32 C26 42 32 46 36 48 C32 48 24 54 26 62 Z" fill="#f97316"/>
  <path d="M22 64 C12 68 10 88 28 96 C26 86 32 82 36 80 C32 80 24 74 26 66 Z" fill="#ea580c"/>
  
  <!-- Right Rust Crab Claw / Bracket -->
  <path d="M106 64 C116 60 118 40 100 32 C102 42 96 46 92 48 C96 48 104 54 102 62 Z" fill="#f97316"/>
  <path d="M106 64 C116 68 118 88 100 96 C102 86 96 82 92 80 C96 80 104 74 102 66 Z" fill="#ea580c"/>

  <!-- Crisp Terminal / Remote Desktop Monitor Screen -->
  <rect x="30" y="32" width="68" height="54" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="4"/>
  <!-- Monitor Stand Base -->
  <path d="M54 88 L50 98 L78 98 L74 88 Z" fill="#22c55e"/>

  <!-- Left: SSH Terminal prompt >_ -->
  <path d="M40 50 L48 57 L40 64" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="52" y1="64" x2="60" y2="64" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right: RDP Remote Desktop 4-pane grid (Emerald Green) -->
  <rect x="68" y="48" width="9" height="9" rx="2" fill="#22c55e"/>
  <rect x="80" y="48" width="9" height="9" rx="2" fill="#22c55e"/>
  <rect x="68" y="60" width="9" height="9" rx="2" fill="#22c55e"/>
  <rect x="80" y="60" width="9" height="9" rx="2" fill="#22c55e"/>
</svg>
