[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tracing = "0.1"

# Dependencies (png, fontdue, alacritty_terminal) are slow unoptimised and make tests crawl.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.guac-display]
opt-level = 2

[profile.dev.package.guac-terminal]
opt-level = 2
