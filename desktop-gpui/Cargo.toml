# 獨立 workspace：GPUI 依賴很重，不併入主 workspace 的 Cargo.lock。
[workspace]

[package]
name = "cracamole-desktop-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# test-support 讓元素可被無頭 UI 測試查詢（無障礙識別，不影響畫面）。
gpui-kit = { version = "0.10.0", features = ["test-support"] }
cracamole-store = { path = "../crates/cracamole-store" }
tokio = { version = "1", features = ["rt-multi-thread"] }
