# 獨立 workspace：GPUI 依賴很重，不併入主 workspace 的 Cargo.lock。
[workspace]

[package]
name = "cracamole-desktop-gpui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# test-support 讓元素可被無頭 UI 測試查詢（無障礙識別，不影響畫面）。
gpui-kit = { version = "0.10.0", features = ["test-support"] }
cracamole-store = { path = "../crates/cracamole-store" }
cracamole-desktop = { path = "../crates/cracamole-desktop" }
guacd = { path = "../crates/guacd" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
image = { version = "0.25", default-features = false }

[dev-dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
rand = "0.10"
