# Java-free end-to-end fixture: Rust application + real sshd/telnetd only.
services:
  backend:
    mem_limit: 128m
    build:
      context: ../tests/e2e
      dockerfile: backend.Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22 && nc -z 127.0.0.1 23"]
      interval: 2s
      timeout: 2s
      retries: 30
  web:
    image: cracamole-web:ci
    build:
      context: ..
      dockerfile: docker/cracamole-web.Dockerfile
    environment:
      CRACAMOLE_ADMIN_USERNAME: admin
      CRACAMOLE_ADMIN_PASSWORD: fixture-admin-password-2026
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["connections:/data"]
    mem_limit: 1536m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  connections:
