# Disposable test environment. Passwords below are fixtures, not deployment credentials.
services:
  initdb:
    image: guacamole/guacamole:1.6.0
    entrypoint: ["/bin/sh", "-c"]
    command: ["/opt/guacamole/bin/initdb.sh --postgresql > /init/001-schema.sql && cp /fixtures/connections.sql /init/002-connections.sql"]
    volumes:
      - schema:/init
      - ../tests/e2e/connections.sql:/fixtures/connections.sql:ro
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guacamole
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: fixture-db-password
    depends_on:
      initdb: { condition: service_completed_successfully }
    volumes: ["schema:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    build:
      context: ../tests/e2e
      dockerfile: backend.Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22 && nc -z 127.0.0.1 23"]
      interval: 2s
      timeout: 2s
      retries: 30
  guacd:
    image: cracamole:ci
    build:
      context: ..
      dockerfile: docker/cracamole.Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  guacamole:
    image: guacamole/guacamole:1.6.0
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_ENABLED: "true"
      POSTGRESQL_HOSTNAME: database
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: fixture-db-password
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      database: { condition: service_healthy }
      backend: { condition: service_healthy }
      guacd: { condition: service_healthy }
volumes:
  schema:
