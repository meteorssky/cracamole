ironrdp-cliprdr = "0.9"
base64 = "0.23"
ironrdp-displaycontrol = "0.10"
ironrdp-tls = { version = "0.3", features = ["rustls"] }

[dev-dependencies]
guac-testkit = { path = "../guac-testkit" }
tokio = { workspace = true, features = ["test-util"] }
