[package]
name = "cracamole-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
guac-protocol = { path = "../guac-protocol" }
guac-session = { path = "../guac-session" }
guacd = { path = "../guacd" }
proto-telnet = { path = "../proto-telnet" }
cracamole-store = { path = "../cracamole-store" }
png = "0.18"
tokio.workspace = true
tokio-util = "0.7"
zeroize = "1"

[dev-dependencies]
guac-display = { path = "../guac-display" }
guac-terminal = { path = "../guac-terminal" }
tokio = { workspace = true, features = ["process"] }
tempfile = "3"
rand = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }

[target."cfg(windows)".dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["listbox", "combobox", "timer", "image-decoder", "cursor", "clipboard", "file-dialog"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
