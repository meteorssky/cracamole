[package]
name = "cracamole-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cracamole-desktop"

# 預設入口是啟動 GPUI 版的啟動器；Win32 原生版為備援。
[[bin]]
name = "cracamole-desktop"
path = "src/launcher.rs"

[[bin]]
name = "cracamole-desktop-win32"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
guac-protocol = { path = "../guac-protocol" }
guac-session = { path = "../guac-session" }
guacd = { path = "../guacd" }
proto-telnet = { path = "../proto-telnet" }
proto-ssh = { path = "../proto-ssh" }
cracamole-store = { path = "../cracamole-store" }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
png = "0.18"
tokio.workspace = true
tokio-util = "0.7"
zeroize = "1"

[dev-dependencies]
guac-display = { path = "../guac-display" }
guac-terminal = { path = "../guac-terminal" }
tokio = { workspace = true, features = ["process"] }
rand = "0.10"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }

[target."cfg(windows)".dependencies]
native-windows-gui = { version = "1.0.13", default-features = false, features = ["listbox", "combobox", "textbox", "timer", "image-decoder", "cursor", "clipboard", "file-dialog", "tree-view"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
