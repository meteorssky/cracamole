name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - name: Install OpenSSH client (ssh-keygen) for key tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-client fonts-noto-cjk
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python -m unittest discover -s tests/oracle -v
      - run: cargo test --workspace -- --ignored
        env:
          STRESS_ITERS: '20000'
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/cracamole.Dockerfile -t cracamole:ci .
      - name: Smoke test
        run: |
          docker run -d --name g --read-only --cap-drop ALL --security-opt no-new-privileges -e LOG_LEVEL=debug cracamole:ci
          for i in $(seq 1 60); do
            if docker exec g nc -z 127.0.0.1 4822; then break; fi
            sleep 1
          done
          docker logs g
          docker exec g nc -z 127.0.0.1 4822
          docker stop -t 10 g
          test "$(docker inspect g --format '{{.State.ExitCode}}')" = "0"
      - name: Compare live C/Rust args (including C self-comparison)
        run: |
          docker compose -p cracamole-oracle -f docker/compose.oracle.yml up -d --wait
          python tests/oracle/compare_args.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Official Java webapp browser tests
        run: |
          docker compose -p cracamole-e2e -f docker/compose.e2e.yml up -d --wait
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://127.0.0.1:18080/guacamole/ > /dev/null
          cd tests/e2e
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Collect container evidence
        if: always()
        run: |
          mkdir -p target/deployment
          docker compose -p cracamole-e2e -f docker/compose.e2e.yml logs > target/deployment/e2e.log 2>&1
          docker image inspect cracamole:ci guacamole/guacd:1.6.0 guacamole/guacamole:1.6.0 > target/deployment/images.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: |
            target/oracle/
            target/deployment/
            tests/e2e/test-results/
            tests/e2e/playwright-report/
      - name: Clean disposable test containers
        if: always()
        run: |
          docker compose -p cracamole-e2e -f docker/compose.e2e.yml down -v
          docker compose -p cracamole-oracle -f docker/compose.oracle.yml down -v
          docker rm -f g || true
  fuzz-nightly:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [parse_instruction, roundtrip, telnet_decoder, vt_input, color_scheme]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=3600 -max_len=8192 -rss_limit_mb=2048
        working-directory: fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
