[package]
name = "cracamole-rdp-fixture"
version = "0.1.0"
edition = "2021"
publish = false

# Keep the fixture's IronRDP version separate from the product workspace.
[workspace]

[dependencies]
ironrdp-server = { version = "=0.13.0", default-features = false }
ironrdp-cliprdr = "=0.7.0"
ironrdp-core = "0.2"
ironrdp-displaycontrol = "=0.8.0"
async-trait = "0.1"
anyhow = "1"
rcgen = "=0.13.2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
